name: Run Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: make test-python

  system-python-tests:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Apple's own python3, not the image's newer one on PATH; fails when Apple moves past 3.9, so the floor can rise
      - name: Check system python3 is 3.9
        run: /usr/bin/python3 -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'

      # The project itself requires 3.14, so this job installs pytest directly instead of using uv. pytest 9 dropped 3.9
      - name: Run tests under system python3
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pytest==8.4.2 vermin==1.9.1
          "$RUNNER_TEMP/venv/bin/pytest" tests/ -q

      # The tests only execute the code paths they cover, so a 3.10+ stdlib call on an uncovered branch would pass them
      - name: Check scripts avoid stdlib APIs newer than 3.9
        run: |
          "$RUNNER_TEMP/venv/bin/vermin" -t=3.9 --eval-annotations --no-parse-comments --no-tips --hidden --exclude 'typing.NotRequired' bin/ dotfiles/ plugins/ skills/

  claude-code-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run mod tests
        run: make test-claude-code-mods
