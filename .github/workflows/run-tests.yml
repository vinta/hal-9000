name: Run Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: make test

  system-python-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Check scripts still parse under system python3
        run: |
          python -m py_compile \
            bin/hal.py \
            dotfiles/.claude/hooks/guard-bash-paths.py \
            plugins/hal-statusline/hal-statusline.py \
            plugins/hal-voice/scripts/hal-voice.py

      - name: Check scripts still import under system python3
        run: |
          python - <<'PY'
          import importlib.machinery
          import importlib.util
          import sys

          SCRIPTS = [
              "bin/hal.py",
              "dotfiles/.claude/hooks/guard-bash-paths.py",
              "plugins/hal-statusline/hal-statusline.py",
              "plugins/hal-voice/scripts/hal-voice.py",
          ]

          failed = []
          for path in SCRIPTS:
              name = path.rsplit("/", 1)[-1].replace("-", "_").replace(".py", "")
              loader = importlib.machinery.SourceFileLoader(name, path)
              spec = importlib.util.spec_from_loader(name, loader)
              module = importlib.util.module_from_spec(spec)
              try:
                  spec.loader.exec_module(module)
              except Exception as exc:
                  failed.append(path)
                  print("FAIL {}: {}: {}".format(path, type(exc).__name__, exc))
              else:
                  print("ok   {}".format(path))

          sys.exit(1 if failed else 0)
          PY
