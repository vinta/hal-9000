name: Scan Secrets

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  BETTERLEAKS_VERSION: 1.8.1

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install betterleaks
        run: |
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
          curl -fsSL -O "${base}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" -O "${base}/checksums.txt"
          grep " betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz\$" checksums.txt | sha256sum --check --strict
          tar -xzf "betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" betterleaks
          install betterleaks /usr/local/bin/

      - name: Scan git history
        run: betterleaks git . --redact --verbose --no-banner
