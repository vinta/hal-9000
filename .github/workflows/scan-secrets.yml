name: Scan Secrets

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install betterleaks
        run: |
          curl -fsSL -O https://github.com/betterleaks/betterleaks/releases/download/v1.8.1/betterleaks_1.8.1_linux_x64.tar.gz -O https://github.com/betterleaks/betterleaks/releases/download/v1.8.1/checksums.txt
          grep " betterleaks_1.8.1_linux_x64.tar.gz\$" checksums.txt | sha256sum --check --strict
          tar -xzf betterleaks_1.8.1_linux_x64.tar.gz betterleaks
          install betterleaks /usr/local/bin/

      - name: Scan git history
        run: betterleaks git . --redact --verbose --no-banner
