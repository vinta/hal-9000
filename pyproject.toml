[project]
name = "hal-9000"
version = "2001"
description = "Opinionated macOS development environment automation"
authors = [{ name = "Vinta Chen", email = "vinta.chen@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[project.urls]
Homepage = "https://vinta.ws/code/"
Repository = "https://github.com/vinta/hal-9000"

[dependency-groups]
test = ["pytest>=9.1.1"]
lint = ["ansible-lint>=26.6.0", "ruff>=0.16.0", "ty>=0.0.64"]
audit = ["detect-secrets>=1.5.0", "pre-commit>=4.6.1"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "audit" },
    "argcomplete>=3.7.0",
]

[tool.uv]
exclude-newer = "3 days"
no-build = true

[tool.uv.pip]
only-binary = [":all:"]

[tool.ruff]
line-length = 200
extend-include = ["bin/hal"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # pydocstyle
    "COM812", # trailing comma (formatter conflict)
    "CPY001", # copyright notice (license lives in LICENSE, not file headers)
    "T20",    # print statements (CLI tools)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",     # type annotations not needed in tests
    "S101",    # assert is the standard for pytest
    "SLF001",  # testing private methods is intentional
    "PLR2004", # magic values are clear in test assertions
]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
include = ["bin/hal", "dotfiles/", "plugins/", "scripts/", "tests/"]

[tool.ty.rules]
blanket-ignore-comment = "error"
division-by-zero = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
unused-ignore-comment = "error"
