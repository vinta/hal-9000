---
# https://github.com/anthropics/claude-code
- name: Install Claude Code
  shell: curl -fsSL https://claude.ai/install.sh | bash
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"

# https://formulae.brew.sh/formula/bash
# CLAUDE_CODE_SHELL in dotfiles/.claude/settings.json points here: macOS /bin/bash is 3.2, which the Bash tool refuses for some commands
- name: Install bash for Claude Code
  homebrew:
    name: bash
    state: latest

# https://github.com/openai/codex
- name: Install Codex
  shell: curl -fsSL https://chatgpt.com/codex/install.sh | sh
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/codex"
  environment:
    CODEX_NON_INTERACTIVE: "1"

# https://ollama.com/download
# Requires sudo to symlink into /usr/local/bin
- name: Install Ollama
  shell: curl -fsSL https://ollama.com/install.sh | sh
  args:
    creates: /usr/local/bin/ollama
  environment:
    OLLAMA_NO_START: "1"

# https://github.com/microsoft/playwright-cli
- name: Install playwright-cli
  shell: |
    eval "$(fnm env --shell bash)"
    npm install -g @playwright/cli@latest
  args:
    executable: /bin/bash
  changed_when: false

# https://github.com/vinta/blackwall
- name: Install blackwall
  shell: |
    eval "$(fnm env --shell bash)"
    npm install -g blackwall-sandbox@latest --min-release-age=0
  args:
    executable: /bin/bash
  changed_when: false

# $ZSH_CUSTOM/completions is on oh-my-zsh's fpath, so no .zshrc edit is needed
- name: Install blackwall zsh completion
  shell: |
    eval "$(fnm env --shell bash)"
    mkdir -p "$HOME/.oh-my-zsh/custom/completions"
    blackwall --completion zsh > "$HOME/.oh-my-zsh/custom/completions/_blackwall"
  args:
    executable: /bin/bash
  changed_when: false
  when: ansible_facts["user_shell"] == "/bin/zsh"

- name: Ensure AI environment is sourced in .zshrc
  lineinfile:
    dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    line: "source {{ REPO_ROOT }}/playbooks/roles/ai/files/ai_profile.sh"
    state: present
  when: ansible_facts["user_shell"] == "/bin/zsh"
