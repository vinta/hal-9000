---
# https://github.com/anthropics/claude-code
- name: Install Claude Code
  shell: curl -fsSL https://claude.ai/install.sh | bash
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"

# https://github.com/openai/codex
- name: Install Codex
  shell: curl -fsSL https://chatgpt.com/codex/install.sh | sh
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/codex"
  environment:
    CODEX_NON_INTERACTIVE: "1"

# https://ollama.com/download
# Requires sudo to symlink into /usr/local/bin
- name: Install Ollama
  shell: curl -fsSL https://ollama.com/install.sh | sh
  args:
    creates: /usr/local/bin/ollama
  environment:
    OLLAMA_NO_START: "1"

# https://github.com/upstash/context7
- name: Install ctx7
  shell: |
    export PATH="/opt/homebrew/bin:$PATH"
    eval "$(fnm env --shell bash)"
    npm install -g ctx7
  args:
    executable: /bin/bash
  changed_when: false

- name: Ensure AI environment is sourced in .zshrc
  lineinfile:
    dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    line: "source {{ REPO_ROOT }}/playbooks/roles/ai/files/ai_profile.sh"
    state: present
  when: ansible_facts["env"]["SHELL"] == "/bin/zsh"
