---
# The homebrew module runs `brew info` before `brew install`, and only `brew install` auto-taps and trusts a fully qualified formula
- name: Tap hashicorp/tap
  homebrew_tap:
    name: hashicorp/tap
    trust: true

# https://developer.hashicorp.com/terraform/install
- name: Install terraform
  homebrew:
    name:
      - hashicorp/tap/terraform
    state: latest
