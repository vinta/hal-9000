---
- name: Tap hashicorp/tap
  homebrew_tap:
    name: hashicorp/tap
    trust: true

# https://developer.hashicorp.com/terraform/install
- name: Install terraform
  homebrew:
    name:
      - hashicorp/tap/terraform
    state: latest

- name: Tap terraform-linters/tap
  homebrew_tap:
    name: terraform-linters/tap
    trust: true

# https://github.com/terraform-linters/tflint#installation
- name: Install tflint
  homebrew_cask:
    name:
      - terraform-linters/tap/tflint
    state: latest

# https://developer.hashicorp.com/terraform/cli/config/config-file#provider-plugin-cache
- name: Create terraform provider plugin cache directory
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.terraform.d/plugin-cache"
    state: directory
    mode: "0755"

- name: Ensure Terraform environment is sourced in .zshrc
  lineinfile:
    dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    line: "source {{ REPO_ROOT }}/playbooks/roles/terraform/files/terraform_profile.sh"
    state: present
  when: ansible_facts["user_shell"] == "/bin/zsh"
