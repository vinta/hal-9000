---
# --client never contacts the API server, so this works with no kubeconfig and no cluster auth.
- name: Check installed kubectl version
  command: "{{ ansible_facts['env']['HOME'] }}/.local/bin/kubectl version --client -o json"
  register: kubernetes_kubectl_version
  failed_when: false
  changed_when: false
  check_mode: false

# https://kubernetes.io/releases/
# https://kubernetes.io/docs/tasks/tools/install-kubectl-macos/
- name: Install kubectl 1.35.6
  shell: |
    ARCH=$(uname -m | sed 's/x86_64/amd64/' | sed 's/aarch64/arm64/')
    curl -sLo /tmp/kubectl "https://dl.k8s.io/release/v1.35.6/bin/darwin/${ARCH}/kubectl"
    mkdir -p "$HOME/.local/bin"
    install -m 0755 /tmp/kubectl "$HOME/.local/bin" && rm /tmp/kubectl
  when: "'v1.35.6' not in kubernetes_kubectl_version.stdout"

- name: Tap derailed/k9s
  homebrew_tap:
    name:
      - derailed/k9s

# https://github.com/derailed/k9s
- name: Install k9s
  homebrew:
    name:
      - derailed/k9s/k9s
    state: latest

- name: Ensure Kubernetes environment is sourced in .zshrc
  lineinfile:
    dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    line: "source {{ REPO_ROOT }}/playbooks/roles/kubernetes/files/k8s_profile.sh"
    state: present
  when: ansible_facts["env"]["SHELL"] == "/bin/zsh"
