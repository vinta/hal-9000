---
# https://docs.cloud.google.com/sdk/docs/install-sdk
- name: Download Google Cloud SDK
  unarchive:
    src: https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-darwin-arm.tar.gz
    remote_src: true
    dest: "{{ ansible_facts['env']['HOME'] }}/"
    creates: "{{ ansible_facts['env']['HOME'] }}/.google-cloud-sdk"

- name: Rename
  command: mv {{ ansible_facts['env']['HOME'] }}/google-cloud-sdk {{ ansible_facts['env']['HOME'] }}/.google-cloud-sdk
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.google-cloud-sdk"

# The installer builds gcloud's virtenv from uv's Python 3.14 here instead of sudo-installing python.org Python.
# Minor version only: `uv python find 3.14` returns the symlink uv repoints on upgrade, while a patch version's directory is left behind by `uv python upgrade`.
- name: Run gcloud installer
  shell: >-
    CLOUDSDK_PYTHON=$(uv python find --no-project 3.14)
    {{ ansible_facts['env']['HOME'] }}/.google-cloud-sdk/install.sh
    --quiet
    --usage-reporting false
    --path-update false
    --command-completion false
    --additional-components gke-gcloud-auth-plugin
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.config/gcloud/virtenv"

# https://docs.cloud.google.com/iap/docs/using-tcp-forwarding#increasing_the_tcp_upload_bandwidth
- name: Install numpy in gcloud virtenv
  command: uv pip install --python {{ ansible_facts['env']['HOME'] }}/.config/gcloud/virtenv/bin/python numpy
  register: gcp_command_result
  changed_when: "'Installed' in gcp_command_result.stderr"

# A component change runs `gcloud components update-macos-python`, which sudo-installs python.org Python
# unless CLOUDSDK_PYTHON is exported, and Ansible doesn't source gcp_profile.sh.
- name: Update gcloud components
  shell: yes 'y' | {{ ansible_facts['env']['HOME'] }}/.google-cloud-sdk/bin/gcloud components update
  environment:
    CLOUDSDK_PYTHON: "{{ ansible_facts['env']['HOME'] }}/.config/gcloud/virtenv/bin/python"
  register: gcp_command_result
  changed_when: "'All components are up to date' not in gcp_command_result.stderr"

- name: Ensure GCP environment is sourced in .zshrc
  lineinfile:
    dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    line: "source {{ REPO_ROOT }}/playbooks/roles/gcp/files/gcp_profile.sh"
    state: present
  when: ansible_facts["env"]["SHELL"] == "/bin/zsh"
