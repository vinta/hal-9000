# https://github.com/betterleaks/betterleaks/blob/main/docs/config.md
title = "hal-9000"

[extend]
useDefault = true

# Paths that never reach a commit: ansible galaxy collections, virtualenvs, tool caches, lockfiles, and the globally gitignored local/ scratch area.
[allowlist]
paths = [
  '''(^|/)\.ansible/''',
  '''(^|/)\.pytest_cache/''',
  '''(^|/)\.ruff_cache/''',
  '''(^|/)\.ty/''',
  '''(^|/)\.venv/''',
  '''(^|/)local/''',
  '''(^|/)uv\.lock$''',
]
