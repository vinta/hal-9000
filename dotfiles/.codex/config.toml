#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-6-astra"
model_reasoning_effort = "high"
model_reasoning_summary = "detailed"
model_verbosity = "high"
hide_agent_reasoning = false
show_raw_agent_reasoning = true
approval_policy = "on-request"
approvals_reviewer = "auto_review"
personality = "pragmatic"
sandbox_mode = "workspace-write"
web_search = "live"

[analytics]
enabled = false

[history]
persistence = "save-all"

[sandbox_workspace_write]
network_access = true
writable_roots = [
    "/Users/vinta/.codex/skills",
    "/Users/vinta/Projects",
    "/usr/local/hal-9000",
]

[features]
memories = true
js_repl = false

[tools]
view_image = true
web_search = { context_size = "high" }

[feedback]
enabled = false

[otel]
exporter = "none"
metrics_exporter = "none"
trace_exporter = "none"

[tui]
notifications = ["agent-turn-complete", "approval-requested"]
notification_condition = "unfocused"
status_line = [
    "model-with-reasoning",
    "current-dir",
    "git-branch",
    "context-remaining",
    "five-hour-limit",
    "weekly-limit",
]

[tui.model_availability_nux]
"gpt-5.6-sol" = 1
gpt-6-astra = 1

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.openaiDeveloperDocs.tools.search_openai_docs]
approval_mode = "approve"

[mcp_servers.openaiDeveloperDocs.tools.fetch_openai_doc]
approval_mode = "approve"

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."ponytail@ponytail"]
enabled = true

[projects."/usr/local/hal-9000"]
trust_level = "trusted"

[projects."/Users/vinta/Projects/awesome-python"]
trust_level = "trusted"

[projects."/Users/vinta/Projects/pangu.js"]
trust_level = "trusted"

[projects."/Users/vinta/Projects/laughing-man"]
trust_level = "trusted"

[projects."/Users/vinta/Projects/vinta.ws"]
trust_level = "trusted"

[projects."/Users/vinta/Projects/mensab"]
trust_level = "trusted"

[projects."/Users/vinta/Projects/finance"]
trust_level = "trusted"

[projects."/Users/vinta/Projects/resume"]
trust_level = "trusted"

[projects."/Users/vinta/Projects/personal"]
trust_level = "trusted"

[memories]
disable_on_external_context = true

[desktop]
followUpQueueMode = "steer"
preventSleepWhileRunning = true
dictationDictionary = []
dock-icon-preference = "app-default"
show-context-window-usage = true
usePointerCursors = true
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
conversationDetailMode = "STEPS_COMMANDS"

[marketplaces.ponytail]
source_type = "git"
source = "https://github.com/DietrichGebert/ponytail.git"

